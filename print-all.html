<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // Force HTTPS (backup for GitHub Pages "Enforce HTTPS"); skip local dev.
    if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
      location.replace('https:' + location.href.slice(5));
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio (print) · Adrian Calderon</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/print.css">
  <style>
    @media screen {
      body { background: #ecebe8; }
      .print-bar { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid var(--line); }
      .print-bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
      .print-bar p { margin: 0; font-size: 13px; color: var(--muted); }
      .print-bar .actions { display: flex; gap: 10px; }
      .sheets { overflow-x: auto; padding: 32px 16px 64px; }
      .sheets .onepager { margin: 0 auto 32px; box-shadow: 0 2px 24px rgba(0, 0, 0, .08); }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
  <script type="module" src="js/print-all.js"></script>
</head>
<body>
  <div class="print-bar">
    <div class="wrap">
      <div>
        <strong>Full portfolio</strong>
        <p id="status">Preparing pages…</p>
      </div>
      <div class="actions">
        <a class="btn" href="index.html">Back to site</a>
        <button type="button" class="btn btn-primary" id="print-btn" disabled>Print / Save as PDF</button>
      </div>
    </div>
  </div>
  <main class="sheets print-root preview" id="print-root"></main>
</body>
</html>
