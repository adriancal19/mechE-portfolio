<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project · Adrian Calderon</title>
  <meta name="description" content="Engineering project by Adrian Calderon.">
  <!-- Link preview. Crawlers don't run JavaScript, so every project link shares this card.
       (No og:url here: project pages differ only by ?slug=, and og:url would merge them.) -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Adrian Calderon">
  <meta property="og:title" content="Engineering project · Adrian Calderon">
  <meta property="og:description" content="Design, analysis and build details from Adrian Calderon's mechanical engineering portfolio.">
  <meta property="og:image" content="https://adrian-calderon.com/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Adrian Calderon, Mechanical Engineering Portfolio">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/print.css">
  <!-- Small QR code library, used for the printable one-pager -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
  <script type="module" src="js/project.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <p class="loading">Loading project…</p>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <!-- Lightbox (native dialog: Esc closes, focus stays inside) -->
  <dialog class="lightbox" id="lightbox" aria-label="Image viewer">
    <div class="lb-top">
      <span id="lb-count"></span>
      <button type="button" class="icon-btn" id="lb-close" aria-label="Close image viewer">✕</button>
    </div>
    <div class="lb-stage">
      <button type="button" class="icon-btn" id="lb-prev" aria-label="Previous image">←</button>
      <figure><img id="lb-img" src="" alt=""></figure>
      <button type="button" class="icon-btn" id="lb-next" aria-label="Next image">→</button>
    </div>
    <p class="lb-caption" id="lb-caption"></p>
  </dialog>

  <!-- The printable one-pager is built here (off-screen until you print) -->
  <div class="print-root" id="print-root" aria-hidden="true"></div>
</body>
</html>
